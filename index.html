<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEXT LEVEL — Portal Gamer</title>
  <meta name="description" content="NEXT LEVEL: o portal gamer. Notícias, comunidade e lançamentos em um só lugar.">
  <meta name="theme-color" content="#070711">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --black: #070711;
      --purple: #A020F0;
      --blue: #245BFF;
      --cyan: #00E5FF;
      --text: #e8e9ff;
      --muted: #9a9cc4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--black); color: var(--text); overflow: hidden; }
    body { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }

    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---------- Conteúdo (lado esquerdo no desktop) ---------- */
    .content {
      position: fixed; z-index: 2;
      left: clamp(24px, 6vw, 112px); top: 50%;
      transform: translateY(-50%);
      width: min(34rem, 42vw);
      opacity: 0; transition: opacity .9s ease .3s;
    }
    body.ready .content { opacity: 1; }

    .eyebrow {
      display: inline-flex; align-items: center; gap: .6rem;
      font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--cyan);
      margin: 0 0 1.1rem;
    }
    .eyebrow::before { content: ""; width: 2.2rem; height: 2px; background: linear-gradient(90deg, var(--purple), var(--cyan)); }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 4.2vw, 3.6rem); line-height: 1.04; font-weight: 800; letter-spacing: -.01em;
    }
    h1 span {
      background: linear-gradient(90deg, var(--purple), var(--blue) 55%, var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lead { margin: 0 0 2rem; font-size: clamp(1rem, 1.25vw, 1.15rem); line-height: 1.6; color: var(--muted); max-width: 30rem; }

    .actions { display: flex; flex-wrap: wrap; gap: .9rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 3rem; padding: 0 1.7rem; border-radius: .6rem;
      font-weight: 700; font-size: 1rem; text-decoration: none; letter-spacing: .02em;
      transition: transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    }
    .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .btn-primary { color: #fff; background: linear-gradient(90deg, var(--purple), var(--blue)); box-shadow: 0 0 0 0 rgba(36,91,255,.0); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(36,91,255,.45), 0 0 18px rgba(160,32,240,.35); }
    .btn-ghost { color: var(--text); border: 1px solid rgba(0,229,255,.45); background: rgba(7,7,17,.45); backdrop-filter: blur(4px); }
    .btn-ghost:hover { border-color: var(--cyan); background: rgba(0,229,255,.1); transform: translateY(-2px); }

    /* ---------- Carregando / erro ---------- */
    #loading {
      position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; align-content: center; gap: 1rem;
      background: var(--black); transition: opacity .6s ease, visibility .6s ease;
    }
    #loading.hidden { opacity: 0; visibility: hidden; }
    #loading p { margin: 0; letter-spacing: .3em; font-size: .8rem; color: var(--cyan); text-transform: uppercase; }
    .bar { width: min(260px, 60vw); height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
    #loading-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--purple), var(--cyan)); transition: width .2s ease; }

    #fallback {
      position: fixed; inset: 0; z-index: 1; display: none;
      background:
        radial-gradient(60vmax 60vmax at 72% 45%, rgba(160,32,240,.35), transparent 60%),
        radial-gradient(50vmax 50vmax at 80% 60%, rgba(36,91,255,.3), transparent 60%),
        var(--black);
    }
    #fallback.visible { display: block; }

    /* ---------- Mobile / retrato: portal centralizado, texto embaixo ---------- */
    @media (max-aspect-ratio: 19/20), (max-width: 760px) {
      .content {
        left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto;
        padding: 4.5rem 1.4rem max(1.6rem, env(safe-area-inset-bottom));
        text-align: center;
        background: linear-gradient(to top, var(--black) 35%, rgba(7,7,17,.85) 65%, transparent);
      }
      .eyebrow { justify-content: center; margin-bottom: .8rem; }
      .eyebrow::before { display: none; }
      h1 { font-size: clamp(1.6rem, 7vw, 2.2rem); margin-bottom: .7rem; }
      .lead { font-size: .98rem; margin: 0 auto 1.3rem; }
      .actions { justify-content: center; }
      .btn { flex: 1 1 9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content, #loading, .btn { transition: none; }
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="fallback"><p id="fallback-msg" style="position:absolute;left:1rem;right:1rem;bottom:1rem;margin:0;font-size:.8rem;color:#ffb4c8;text-align:center"></p></div>

  <div id="loading" role="status" aria-live="polite">
    <p>Carregando</p>
    <div class="bar"><div id="loading-bar"></div></div>
    <p id="diag" style="display:none;max-width:34rem;margin:1rem 1.2rem 0;text-align:center;letter-spacing:0;text-transform:none;font-size:.9rem;line-height:1.5;color:#ffb4c8"></p>
  </div>

  <!-- Diagnóstico: se o módulo 3D não iniciar em 6 s, mostra o motivo provável na tela -->
  <script>
    (function () {
      var diag = document.getElementById('diag');
      function show(msg) { if (!diag) return; diag.style.display = 'block'; diag.textContent = msg; }
      window.addEventListener('error', function (e) { show('Erro de script: ' + (e.message || 'desconhecido')); });
      window.addEventListener('unhandledrejection', function (e) { show('Erro: ' + ((e.reason && e.reason.message) || e.reason)); });
      if (location.protocol === 'file:') {
        show('A página foi aberta como arquivo (file://). Rode um servidor local na pasta (python -m http.server 8000) e abra http://localhost:8000');
        return;
      }
      setTimeout(function () {
        if (!window.__nlStarted) show('O script 3D não iniciou. Verifique a internet (o Three.js vem do cdn.jsdelivr.net) e se nextlevel3d.js está na mesma pasta do index.html. Abra o console (F12) para ver o erro.');
      }, 6000);
    })();
  </script>

  <main class="content">
    <p class="eyebrow">Portal gamer</p>
    <h1><span class="sr-only">NEXT LEVEL — </span>O <span>próximo nível</span> dos games começa aqui.</h1>
    <p class="lead">Notícias, lançamentos, guias e comunidade em um só lugar. Atravesse o portal.</p>
    <div class="actions">
      <a class="btn btn-primary" href="./jogos.html">Entrar no portal</a>
      <a class="btn btn-ghost" href="./jogos.html#lancamentos">Ver jogos</a>
    </div>
  </main>

  <noscript>
    <style>#loading{display:none}.content{opacity:1}</style>
  </noscript>

  <script type="module" src="./nextlevel3d.js"></script>
</body>
</html>
